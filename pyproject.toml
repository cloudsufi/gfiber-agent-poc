[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-shared-tools"
version = "0.1.0"
description = "Proto-first, config-driven tool framework for ADK agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CloudSufi", email = "sumit.sharma@cloudsufi.com" }]
keywords = ["adk", "agents", "tools", "grpc", "protobuf", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "grpcio>=1.63",
    "grpcio-tools>=1.63",
    "protobuf>=4.25",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.0"]
mcp      = ["mcp>=1.0"]
all      = ["ai-agent-shared-tools[bigquery,mcp]"]
dev      = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",      # httpx mock
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage   = "https://github.com/cloudsufi/ai-agent-shared-tools"
Repository = "https://github.com/cloudsufi/ai-agent-shared-tools"

# ── src layout — flat structure ───────────────────────────────────────────────
# src/ IS the agent_tools package.  Sub-directories (core/, handlers/, …) are
# its sub-packages.  setuptools resolves them via the package-dir mapping.
[tool.setuptools]
packages = [
    "agent_tools",
    "agent_tools.core",
    "agent_tools.handlers",
    "agent_tools.middleware",
    "agent_tools.proto",
]

[tool.setuptools.package-dir]
"agent_tools" = "src"   # agent_tools   → src/
                        # agent_tools.core → src/core/  (inferred automatically)

[tool.setuptools.package-data]
# schemas/ and tools/ are data directories (no __init__.py).
# Paths are relative to the package root, i.e. relative to src/.
"agent_tools" = [
    "schemas/*.proto",
    "tools/**/*.yaml",
    "tools/**/*.proto",
]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["tests"]
addopts        = "-v --tb=short --cov=agent_tools --cov-report=term-missing"

# ── ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
src         = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict         = false
ignore_missing_imports = true
