# Schema for the `config:` block of a `type: cta` tool (Dialogflow CX).
$schema: "http://json-schema.org/draft-07/schema#"
title: CTAToolConfig
type: object
additionalProperties: false
required: [project_id, location, agent_id]
properties:
  project_id:        { type: string }
  location:          { type: string }
  agent_id:          { type: string }
  language_code:     { type: string }
  text_field:
    type: string
    description: Which validated-input field carries the user's utterance. Defaults to "text".
  session_id_field:
    type: string
    description: Which validated-input field carries the session id. Generates a uuid4 if empty.
  api_endpoint:      { type: string }
  mock_mode:
    type: boolean
    description: When true, returns a stub response without calling Dialogflow.
  timeout_seconds:
    type: integer
    minimum: 0
  auth:
    type: object
    additionalProperties: true
