# Shared auth config schema — referenced (inlined) by every tool-type
# config that accepts credentials. One of the auth_type keys should be
# present; all of them are optional at the JSON-Schema level because
# tools may omit auth entirely.
$schema: "http://json-schema.org/draft-07/schema#"
title: AuthConfig
type: object
additionalProperties: false
properties:

  # Authorization: Bearer <resolved>
  bearer:
    type: object
    additionalProperties: false
    properties:
      token: { $ref: "#/definitions/SecretRef" }
      token_env: { type: string }          # legacy shorthand for ENV source

  # <header_name>: <resolved>
  api_key:
    type: object
    additionalProperties: false
    properties:
      header_name: { type: string }
      key: { $ref: "#/definitions/SecretRef" }
      key_env: { type: string }            # legacy shorthand

  # OAuth 2.0 client_credentials flow — token minted per call
  oauth2:
    type: object
    additionalProperties: false
    properties:
      client_id: { $ref: "#/definitions/SecretRef" }
      client_secret: { $ref: "#/definitions/SecretRef" }
      token_url: { type: string }
      scope: { type: string }
      client_id_env: { type: string }      # legacy
      client_secret_env: { type: string }  # legacy

  # HTTP Basic — base64(user:pass) synthesised by AuthMiddleware
  basic:
    type: object
    additionalProperties: false
    properties:
      username: { $ref: "#/definitions/SecretRef" }
      password: { $ref: "#/definitions/SecretRef" }
      username_env: { type: string }       # legacy
      password_env: { type: string }       # legacy

  # GCP service-account JSON key (from env / file / Secret Manager)
  service_account:
    type: object
    additionalProperties: false
    properties:
      credentials: { $ref: "#/definitions/SecretRef" }
      scopes:
        type: array
        items: { type: string }
      audience: { type: string }           # when set, mints an ID token

  # GCP Application Default Credentials, optionally impersonating
  service_agent:
    type: object
    additionalProperties: false
    properties:
      target_principal: { type: string }
      scopes:
        type: array
        items: { type: string }
      audience: { type: string }

definitions:
  SecretRef:
    type: object
    additionalProperties: false
    properties:
      source:
        type: string
        enum: [ENV, HEADER, PARAMETER, GCP_SECRET]
      name: { type: string }
