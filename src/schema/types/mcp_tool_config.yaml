# Schema for the `config:` block of a `type: mcp` tool.
$schema: "http://json-schema.org/draft-07/schema#"
title: MCPToolConfig
type: object
additionalProperties: false
required: [endpoint, tool_name]
properties:
  endpoint:
    type: string
    description: URL of the MCP server.
  tool_name:
    type: string
    description: Named tool exposed on the MCP server.
  metadata:
    type: object
    additionalProperties: { type: string }
  timeout_seconds:
    type: integer
    minimum: 0
  mock_mode:
    type: boolean
    description: >
      When true, skip the MCP client entirely and return a deterministic
      echo — useful for demos and tests.
  auth:
    type: object
    additionalProperties: true
