# Schema for the `config:` block of a `type: function` tool.
$schema: "http://json-schema.org/draft-07/schema#"
title: FunctionToolConfig
type: object
additionalProperties: false
properties:
  env_vars:
    type: object
    additionalProperties: { type: string }
    description: Documentation-only — logged for visibility.
  parameters:
    type: object
    additionalProperties: { type: string }
    description: Static values merged into the run() inputs alongside the validated request.
  async_mode:
    type: boolean
    description: Reserved — all handlers are async today.
