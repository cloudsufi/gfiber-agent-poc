name:        check_billing
version:     "1.0"
type:        api
description: "Retrieve billing summary and line items for a customer in a given period."

input_schema:  request.proto
output_schema: response.proto

config:
  endpoint: "https://api.billing.internal/v1/bills"
  method:   GET
  auth:
    bearer:
      token_env: BILLING_API_KEY
  params:
    customer_id: "{{customer_id}}"
    period:      "{{period}}"
  timeout_seconds: 10
  max_retries:     2

execution:
  retries: 2
  timeout: 10