syntax = "proto3";
package weather_api;

// Subset of the httpbin.org/anything response that we care about. The
// response middleware ignores unknown fields so the rest of the payload
// silently drops.
message WeatherApiResponse {
  string              url     = 1;
  string              method  = 2;
  map<string, string> args    = 3;
  map<string, string> headers = 4;
  string              origin  = 5;
}
