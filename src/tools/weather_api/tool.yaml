name:        weather_api
version:     "1.0"
type:        api
description: "Return current weather for a city (demo uses httpbin.org/anything to echo the call)."

input_schema:  input.yaml
output_schema: output.yaml

config:
  endpoint: "https://jsonplaceholder.typicode.com/todos/{{id}}"
  method:   GET

  # Templated headers — filled at call time from the validated request / env
  headers:
    Accept:       application/json

  timeout_seconds: 10
  max_retries:     1

execution:
  retries: 1
  timeout: 10
