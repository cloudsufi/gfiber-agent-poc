name:        weather_api
version:     "1.0"
type:        api
description: "Return current weather for a city (demo uses httpbin.org/anything to echo the call)."

input_schema:  request.proto
output_schema: response.proto

config:
  endpoint: "https://httpbin.org/anything"
  method:   GET
  params:
    city:  "{{city}}"
    units: "{{units}}"

  # Templated headers — filled at call time from the validated request / env
  headers:
    Accept:       application/json
    X-Agent-Env:  "{{env:AGENT_ENV}}"     # from process env (optional — skipped if unset)
    X-Trace-Id:   "{{trace_id}}"          # from request proto field

  # Explicit opt-in: names below may also be supplied by the agent runtime
  # via ``with_request_headers(...)`` or the ``_headers=`` kwarg. Any other
  # header the agent injects is silently dropped.
  runtime_headers:
    - X-Trace-Id

  # Bearer token sourced from env var (legacy shorthand still works)
  auth:
    bearer:
      token_env: WEATHER_API_KEY

  timeout_seconds: 10
  max_retries:     1

execution:
  retries: 1
  timeout: 10
