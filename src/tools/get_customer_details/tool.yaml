name:        get_customer_details
version:     "1.0"
type:        openapi
description: "Get customer details from help center API by account ID."

input_schema:  input.yaml
output_schema: output.yaml

config:
  operation_id:   getCustomerDetails
  server_url_env: GFIBER_API_BASE_URL   # override server URL from spec via env var
  auth:
    bearer:
      token_env: GFIBER_API_KEY
  timeout_seconds: 10
  max_retries:     1

execution:
  retries: 1
  timeout: 10
