name:        support_cta
version:     "1.0"
type:        cta
description: "Route a customer query to the support Dialogflow CX agent (demo runs in mock_mode)."

input_schema:  input.yaml
output_schema: output.yaml

config:
  project_id:       demo-gcp-project
  location:         us-central1
  agent_id:         00000000-0000-0000-0000-000000000000
  language_code:    en
  text_field:       text
  session_id_field: session_id

  # Flip mock_mode to false once you have a real CX agent + credentials.
  # When running with mock_mode=true no credentials are needed.
  mock_mode: true

  # Uncomment when calling a real CX agent. Remove entirely to use ADC.
  # auth:
  #   service_agent:
  #     scopes:
  #       - https://www.googleapis.com/auth/cloud-platform

  timeout_seconds: 20

execution:
  retries: 0
  timeout: 20
