syntax = "proto3";
package agent_tools;

// Shared typed auth config — embedded in every tool type that needs credentials.
message AuthConfig {
  oneof auth_type {
    BearerAuth  bearer  = 1;
    ApiKeyAuth  api_key = 2;
    OAuth2Auth  oauth2  = 3;
    BasicAuth   basic   = 4;
  }
}

// Authorization: Bearer <resolved env value>
message BearerAuth {
  string token_env = 1;
}

// Custom header: <header_name>: <resolved env value>
message ApiKeyAuth {
  string header_name = 1;
  string key_env     = 2;
}

// OAuth2 client-credentials flow — token fetched automatically before each call
message OAuth2Auth {
  string client_id_env     = 1;
  string client_secret_env = 2;
  string token_url         = 3;
  string scope             = 4;
}

// HTTP Basic auth
message BasicAuth {
  string username_env = 1;
  string password_env = 2;
}
