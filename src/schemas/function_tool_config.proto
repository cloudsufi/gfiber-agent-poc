syntax = "proto3";
package agent_tools;

// Function tool — user-defined Python code in ``logic.py`` with an
// ``async run(inputs) -> dict`` entrypoint. Inputs are the validated request
// proto merged with the declarative ``parameters`` map below.
message FunctionToolConfig {
  map<string, string> env_vars   = 1;   // logged-but-not-required for visibility
  map<string, string> parameters = 2;   // static params merged into inputs
  bool                async_mode = 3;   // reserved — all handlers are async today
}
