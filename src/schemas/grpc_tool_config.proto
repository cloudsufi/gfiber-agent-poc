syntax = "proto3";
package agent_tools;
import "auth_config.proto";

message GRPCToolConfig {
  string     endpoint        = 1;
  string     service_name    = 2;
  string     method_name     = 3;
  bool       use_tls         = 4;
  AuthConfig auth            = 5;
  int32      timeout_seconds = 6;
}
