syntax = "proto3";
package agent_tools;
import "auth_config.proto";

// CTA — Conversational Tooling Agent. Delegates to a Google Dialogflow CX
// conversational agent: the framework sends the user's text to a session
// on the configured agent and returns the fulfilled response + session
// state for the next turn.
message CTAToolConfig {
  string     project_id        = 1;
  string     location          = 2;   // e.g. "us-central1" or "global"
  string     agent_id          = 3;
  string     language_code     = 4;   // e.g. "en"

  // Which validated-input field holds the user's utterance. Defaults to
  // "text" if not set.
  string     text_field        = 5;

  // Which validated-input field holds the session id. If empty, a fresh
  // session id is generated on every call.
  string     session_id_field  = 6;

  // Optional — override the endpoint (e.g. regional dialogflow.googleapis.com).
  string     api_endpoint      = 7;

  // Credentials — typically service_account or service_agent.
  AuthConfig auth              = 8;

  // Return a stubbed response without calling Dialogflow. Useful for local
  // demos and tests. The stub echoes the input text with a synthesized
  // "agent_response" field.
  bool       mock_mode         = 9;

  int32      timeout_seconds   = 10;
}
