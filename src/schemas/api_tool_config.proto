syntax = "proto3";
package agent_tools;
import "auth_config.proto";

message APIToolConfig {
  string endpoint                  = 1;
  string method                    = 2;
  map<string, string> headers      = 3;
  AuthConfig auth                  = 4;
  map<string, string> params       = 5;
  string body_template             = 6;
  string request_content_type      = 7;
  int32  timeout_seconds           = 8;
  int32  max_retries               = 9;
}
