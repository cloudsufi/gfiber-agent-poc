# Input schema for weather_api tool (documentation + optional runtime validation).
# Mirrors the OpenAPI query parameters for reference.
$schema: "http://json-schema.org/draft-07/schema#"
title: WeatherForecastInput
type: object
required: [latitude, longitude]
additionalProperties: false
properties:
  latitude:
    type: number
    minimum: -90
    maximum: 90
    description: Geographic latitude (-90 to 90)
  longitude:
    type: number
    minimum: -180
    maximum: 180
    description: Geographic longitude (-180 to 180)
  current:
    type: string
    description: Comma-separated current weather variables (e.g. "temperature_2m,wind_speed_10m")
  hourly:
    type: string
    description: Comma-separated hourly variables
  temperature_unit:
    type: string
    enum: [celsius, fahrenheit]
    default: celsius
  wind_speed_unit:
    type: string
    enum: [kmh, ms, mph, kn]
    default: kmh
  timezone:
    type: string
    default: UTC
    description: Timezone string (e.g. "America/New_York") or "auto"
  forecast_days:
    type: integer
    minimum: 1
    maximum: 16
    default: 7
